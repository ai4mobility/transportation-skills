name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt

      - name: Check the skills this pull request changes (and that it changes one folder)
        if: github.event_name == 'pull_request'
        run: python tools/check_skill.py --changed ${{ github.event.pull_request.base.sha }}

      - name: Check every skill
        if: github.event_name != 'pull_request'
        run: python tools/check_skill.py --all

      - name: Run each skill's tests
        run: |
          status=0
          for d in skills/*/; do
            if ls "$d"evals/test_*.py >/dev/null 2>&1; then
              echo "== $d"
              python -m pytest -q -p no:cacheprovider "$d"evals || status=1
            fi
          done
          exit $status

      - name: Test the repository's own tools
        run: python -m pytest -q -p no:cacheprovider tests

  marketplace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code
      - name: Validate the Claude Code marketplace file
        run: claude plugin validate .
